name: Deploy to GitHub Pages (Simple)

on:
  workflow_dispatch: # Manual trigger only for testing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js with test values
        run: |
          echo "Creating config.js with placeholder values for testing..."
          cat > config.js << 'EOF'
          const CONFIG = {
            OPENWEATHER_API_KEY: "test-key-please-add-real-secrets",
            OPENCAGE_API_KEY: "test-key-please-add-real-secrets",
            UNSPLASH_API_KEY: "test-key-please-add-real-secrets",
          };

          if (typeof window !== 'undefined') {
            window.CONFIG = CONFIG;
          }

          console.log('Test configuration loaded - please add real secrets!');
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
