<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherize</title>
  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Weatherize" />
  <meta property="og:description" content="Live weather updates from the current location and from around the world" />
  <meta property="og:image" content="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
  <meta property="og:url" content="https://weather.parthib22.repl.co/" />
  <meta property="og:site_name" content="Weatherize: Live Weather" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Weatherize" />
  <meta name="twitter:description" content="Live weather updates from the current location and from around the world" />
  <meta name="twitter:image" content="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
  <!-- <link rel="manifest" href="manifest.json" /> -->
  <meta name="description" content="Live weather updates from the current location and from around the world" />
  <link rel="canonical" href="" />
  <link rel="preconnect" href="https://api.openweathermap.org" />
  <link rel="preconnect" href="https://api.opencagedata.com" />
  <link rel="preconnect" href="https://api.unsplash.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <!-- <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
      rel="stylesheet"
    /> -->
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
  <script src="./script.js" defer></script>

  <link rel="icon" type="image/x-icon" href="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
</head>

<body>
  <div class="card">
    <div class="search">
      <input type="text" class="search-bar" placeholder="Search a city" spellcheck="false" />
      <button name="search button" aria-label="search button" aria-labelledby="search button">
        <img src="public/search.svg" alt="">
      </button>
    </div>
    <div class="weather loading">
      <h2 class="city"><span> </span></h2>
      <div class="temp-flex">
        <h2 class="temp"></h2>
        <div class="flex">
          <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="description" class="icon" />
          <div class="description"></div>
        </div>
      </div>
      <div class="feel-container">
        <div class="feel"><span> </span></div>
      </div>
      <div class="min-max-hum-wind">
        <div class="min-max">
          <div class="max"><span> </span></div>
          <div class="min"><span> </span></div>
        </div>

        <div class="hum-wind">
          <div class="humidity"><span> </span></div>
          <div class="wind"><span> </span></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
