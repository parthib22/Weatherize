<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherize</title>
  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Weatherize" />
  <meta property="og:description" content="Live weather updates from the current location and from around the world" />
  <meta property="og:image" content="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
  <meta property="og:url" content="https://weather.parthib22.repl.co/" />
  <meta property="og:site_name" content="Weatherize: Live Weather" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Weatherize" />
  <meta name="twitter:description" content="Live weather updates from the current location and from around the world" />
  <meta name="twitter:image" content="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
  <!-- <link rel="manifest" href="manifest.json" /> -->
  <meta name="description" content="Live weather updates from the current location and from around the world" />
  <link rel="canonical" href="" />
  <link rel="preconnect" href="https://api.openweathermap.org" />
  <link rel="preconnect" href="https://api.opencagedata.com" />
  <link rel="preconnect" href="https://api.unsplash.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          spacing: {
            '25': '6.25rem',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
  <script src="./script.js" defer></script>

  <link rel="icon" type="image/x-icon" href="https://img.icons8.com/sf-regular-filled/48/FAB005/sun.png" />
</head>

<body class="flex justify-center items-center h-screen w-screen m-0 p-0 bg-slate-950 overflow-x-hidden"
  style="background-position: center; background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">
  <main
    class="flex flex-col gap-6 bg-[rgba(0,0,0,0.05)] text-white p-8 overflow-x-hidden z-10 sm:rounded-3xl sm:backdrop-blur-3xl max-sm:w-screen max-sm:h-full max-sm:min-h-screen max-sm:bg-black max-sm:bg-opacity-50">

    <div class="weather loading flex flex-col">
      <div class="flex flex-row items-center justify-between gap-2">
        <h2 class="city text-3xl font-semibold"></h2>
        <div class="time text-right my-4">
          <div class="line1 text-sm font-medium"></div>
          <div class="line2 text-xs opacity-70"></div>
        </div>
      </div>

      <div class="temp-flex flex items-center justify-center flex-col">
        <div class="flex flex-col items-center justify-center -m-8 aspect-square h-[200px]">
          <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="description"
            class="icon aspect-square" />
        </div>
        <h2 class="temp text-7xl font-black flex "></h2>
        <div class="mt-4">

          <div class="feel text-base"></div>
          <div class="description opacity-60 capitalize text-sm text-left"></div>
        </div>
      </div>
      <div class="advanced-data flex items-center justify-center my-8">
        <div class="min-max pr-2 grid gap-2">
          <div class="max">
            <img src="public/arrow.svg" class="invert w-4 inline" alt="maximum temperature">
            <span></span>
          </div>
          <div class="min">
            <img src="public/arrow.svg" class="invert rotate-180 w-4 inline" alt="minimum temperature">
            <span></span>
          </div>
        </div>

        <div class="wind-pre border-x border-white border-opacity-20 px-2 grid gap-2">
          <div class="wind">
            <img src="public/wind.svg" class="invert w-4 inline" alt="wind speed">
            <span></span>
          </div>
          <div class="pressure">
            <img src="public/pressure.svg" class="invert w-4 inline" alt="pressure">
            <span></span>
          </div>
        </div>
        <div class="hum-vis pl-2 grid gap-2">
          <div class="humidity">
            <img src="public/humid.svg" class="invert w-4 inline" alt="humidity">
            <span></span>
          </div>
          <div class="visibility">
            <img src="public/visible.svg" class="invert w-4 inline" alt="visibility">
            <span></span>
          </div>
        </div>
      </div>

      <nav class="flex items-center justify-between border-t border-white border-opacity-50 rounded-none">
        <input type="text"
          class="search-bar outline-none px-2 placeholder-white placeholder-opacity-50 bg-transparent max-sm:backdrop-blur-xl"
          placeholder="Search a city" spellcheck="false" />
        <button name="search button" aria-label="search button" aria-labelledby="search button"
          class="search-button rounded-full aspect-square w-16 outline-none cursor-pointer transition-all duration-200 ease-in-out flex justify-center items-center hover:bg-gray-500 hover:bg-opacity-40 sm:bg-transparent max-sm:backdrop-blur-sm">
          <img src="public/search.svg" alt="">
        </button>
      </nav>
    </div>
  </main>
</body>

</html>
